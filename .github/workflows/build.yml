name: Build and Release AppImage
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    # Pinned rather than "ubuntu-latest": the label moves to Ubuntu 26
    # during 2026, and a build that breaks on a runner the project did
    # not choose is a build that breaks for no reason.
    runs-on: ubuntu-24.04
    # A test that hangs -- a modal dialog nobody can close, a tool that
    # waits for a compositor that is not there -- would otherwise hold
    # the job for six hours before the runner gives up.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb x11-xserver-utils
    - name: Run tests
      run: |
        for t in tests/test_*.py; do
          echo "== $t"
          xvfb-run -a python3 "$t"
        done

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          fuse libfuse2 python3-tk tk8.6 tcl8.6 imagemagick \
          xvfb x11-xserver-utils file

    - name: Build AppImage
      run: |
        chmod +x build_appimage.sh
        ./build_appimage.sh

    - name: Verify the AppImage runs
      run: |
        # Start the packaged application through its own AppRun against
        # a virtual display, so a missing library or Tcl script
        # directory shows up here rather than on a user's machine.
        # Runs with the host's Python hidden, which is the situation the
        # bundle exists for.
        xvfb-run -a env -u PYTHONPATH -u PYTHONHOME \
          ./Linux_CRU-x86_64.AppImage --self-test

    - name: Check the tag matches the version in the code
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        code_version=$(python3 -c "import linux_cru; print(linux_cru.__version__)")
        tag_version="${GITHUB_REF_NAME#v}"
        if [ "$code_version" != "$tag_version" ]; then
          echo "tag $GITHUB_REF_NAME does not match __version__ $code_version" >&2
          exit 1
        fi
        echo "version $code_version"

    # Releases come from tags now. Pushing to main builds and tests but
    # publishes nothing, so a release stays the thing that was announced
    # instead of being replaced by the next commit.
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Linux CRU ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: Linux_CRU-x86_64.AppImage
        generate_release_notes: true
        # The notes live in the repository, in docs/releases, so that they
        # are versioned with the code and the workflow cannot replace
        # them with something else.
        body_path: docs/releases/${{ github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
